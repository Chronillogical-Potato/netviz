<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html,
      body,
      #root {
        min-height: 100%;
      }
      body {
        margin: 0;
      }
      html.dark,
      html.dark body {
        background: #0a0a0a;
        color-scheme: dark;
      }
      html.light,
      html.light body {
        background: #ffffff;
        color-scheme: light;
      }
    </style>
    <script data-theme-bootstrap>
      (() => {
        const root = document.documentElement;
        let theme = "dark";
        try {
          const saved = localStorage.getItem("theme");
          if (saved === "light" || saved === "dark") {
            theme = saved;
          } else if (saved === "system") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
        } catch {}
        root.classList.remove("light", "dark");
        root.classList.add(theme);
        root.style.colorScheme = theme;
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Netviz</title>
      <style id="cookie-offline-fonts">
      @font-face {
        font-family: 'Fira Code Nerd Font Propo';
        src: url('/fonts/FiraCodeNerdFontPropo-Retina.ttf') format('truetype');
        font-weight: 400; font-style: normal; font-display: swap;
      }
      @font-face {
        font-family: 'Fira Code Nerd Font Mono';
        src: url('/fonts/FiraCodeNerdFontMono-Retina.ttf') format('truetype');
        font-weight: 400; font-style: normal; font-display: swap;
      }
      @font-face {
        font-family: 'Geist Pixel Line';
        src: url('/fonts/GeistPixel-Line.otf') format('opentype');
        font-weight: 400; font-style: normal; font-display: swap;
      }
      /* Geist titles only in standalone header containers */
      .cookie-title, header.cookie-title-block, [data-cookie-title] {
        font-family: 'Geist Pixel Line', monospace;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
